name: factorybox-production

services:
  postgres:
    image: postgres:16-alpine
    container_name: factorybox-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      TZ: ${TZ:-Europe/Istanbul}
    volumes:
      - factorybox_prod_pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mqtt:
    image: eclipse-mosquitto:2
    container_name: factorybox-prod-mqtt
    restart: unless-stopped
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      TZ: ${TZ:-Europe/Istanbul}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        rm -f /tmp/factorybox_password_file
        mosquitto_passwd -b -c /tmp/factorybox_password_file "$${MQTT_USERNAME}" "$${MQTT_PASSWORD}"
        chmod 0644 /tmp/factorybox_password_file
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "${MQTT_PUBLIC_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - factorybox_prod_mqttdata:/mosquitto/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -u \"$${MQTT_USERNAME}\" -P \"$${MQTT_PASSWORD}\" -t 'factorybox/health/$${HOSTNAME}' -m 'ok' -q 0 >/dev/null 2>&1"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s

  backend:
    image: factorybox-backend:${FACTORYBOX_IMAGE_TAG:-v6.6.6}
    build:
      context: ../..
      dockerfile: deployment/production/Dockerfile.backend
    container_name: factorybox-prod-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3100
      PGHOST: postgres
      PGPORT: 5432
      MQTT_URL: mqtt://mqtt:1883
      FACTORYBOX_BACKUP_DIR: /app/backups
      PG_DUMP_PATH: /usr/bin/pg_dump
      PG_RESTORE_PATH: /usr/bin/pg_restore
      FACTORYBOX_POSTGRES_CONTAINER: ""
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    volumes:
      - ../../Backups:/app/backups
      - ./data/logs/backend:/app/logs
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3100/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 45s

  nginx:
    image: nginx:1.27-alpine
    container_name: factorybox-prod-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FACTORYBOX_HTTP_PORT:-8080}:80"
      - "${FACTORYBOX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/active/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/local:/etc/nginx/local:ro
      - ./certs/acme:/var/www/certbot
      - ./certs/letsencrypt:/etc/letsencrypt:ro
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health | grep -q ok"]
      interval: 20s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: factorybox-prod-n8n
    restart: unless-stopped
    profiles: ["automation"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_SECURE_COOKIE: "false"
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      - backend
      - frontend

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: factorybox-prod-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

networks:
  frontend:
  backend:
    internal: true

volumes:
  factorybox_prod_pgdata:
  factorybox_prod_mqttdata:
