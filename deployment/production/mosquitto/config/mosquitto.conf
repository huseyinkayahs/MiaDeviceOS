persistence true
persistence_location /mosquitto/data/
autosave_interval 1800

# Container loglarini Docker stdout uzerinden yayinla.
# Windows bind-mount log klasoru izin sorunlarinin restart dongusu olusturmasini engeller.
log_dest stdout
log_timestamp true
log_type error
log_type warning
log_type notice
connection_messages true

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /tmp/factorybox_password_file

max_connections -1
max_packet_size 1048576
max_queued_messages 1000
persistent_client_expiration 14d
