server {
    listen 80;
    server_name __DOMAIN__;
    absolute_redirect off;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = / {
        return 302 /admin.html;
    }

    location = /index.html {
        return 302 /admin.html;
    }

    location / {
        proxy_pass http://backend:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 120s;
    }
}

# Internal HTTP origin for Cloudflare Tunnel. This port is not published to Windows.
server {
    listen 8081;
    server_name _;
    absolute_redirect off;
    client_max_body_size 10m;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / { return 302 /admin.html; }
    location = /index.html { return 302 /admin.html; }

    location / {
        proxy_pass http://backend:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
