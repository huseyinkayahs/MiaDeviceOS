server {
    listen 80;
    server_name _;
    absolute_redirect off;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 301 https://$host:__HTTPS_PORT__/admin.html;
    }

    location = /index.html {
        return 301 https://$host:__HTTPS_PORT__/admin.html;
    }

    location / {
        return 301 https://$host:__HTTPS_PORT__$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;
    absolute_redirect off;

    ssl_certificate /etc/nginx/local/factorybox.crt;
    ssl_certificate_key /etc/nginx/local/factorybox.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /admin.html;
    }

    location = /index.html {
        return 302 /admin.html;
    }

    location / {
        proxy_pass http://backend:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port __HTTPS_PORT__;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
